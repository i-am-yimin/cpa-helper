name: Deploy AI Gateway

on:
  push:
    branches: [ext]
    paths: ['backend/**', 'frontend/**', 'Dockerfile', '.dockerignore', '.gitattributes', 'VERSION', 'deploy/**', '.github/workflows/deploy-production.yml', '.github/actionlint.yaml']
  workflow_dispatch:

concurrency:
  group: cpa-helper-production-rainyun
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'i-am-yimin/cpa-helper' && github.ref == 'refs/heads/ext'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend validation
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund && npm run lint && npm run test:i18n
      - name: Antigravity UI regression
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium --only-shell
          npm run dev -- --host 127.0.0.1 --port 5174 --strictPort > /tmp/cpa-helper-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5174/ > /dev/null; then break; fi
            sleep 1
          done
          npx playwright test antigravity-quota.spec.ts
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Backend regression
        working-directory: backend
        run: |
          go test ./... -timeout=10m
          go test ../deploy/bind-oidc.go ../deploy/bind-oidc_test.go
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable production image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/i-am-yimin/cpa-helper:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=ghcr.io/i-am-yimin/cpa-helper:sha-${GITHUB_SHA}@${DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: [self-hosted, linux, cpa-helper-deploy]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      # No checkout or JavaScript action executes on the production node.
      - name: Deploy verified images and check health
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$REGISTRY_USER"
            printf '%s\n' "$REGISTRY_TOKEN"
          } | sudo -n /usr/local/sbin/cpa-helper-deploy "$IMAGE" "$GITHUB_SHA"
