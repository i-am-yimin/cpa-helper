server {
    listen 80;
    server_name aigateway.nigulas.top;
    include /usr/local/openresty/nginx/conf/snippets/acme-challenge.conf;
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name aigateway.nigulas.top;
    ssl_certificate /etc/letsencrypt/live/aigateway.nigulas.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aigateway.nigulas.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64m;
    access_log logs/aigateway.access.log;
    error_log logs/aigateway.error.log;

    # Management APIs remain reachable only inside the Docker network/host.
    location ^~ /v0/management { return 404; }
    location ^~ /v8/management { return 404; }
    location = /management.html { return 404; }

    location /v1/ {
        proxy_pass http://127.0.0.1:8317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:18317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
